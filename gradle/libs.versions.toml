room = { id = "androidx.room", version.ref = "room" }
konfig = { id ="com.codingfeline.buildkonfig", version.ref = "buildKonfig"}

[bundles]
ktor = [
    "ktor-client-core",
    "ktor-client-content-negotiation",
    "ktor-client-auth",
    "ktor-client-logging",
    "ktor-serialization-kotlinx-json",
